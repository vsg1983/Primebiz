<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Primebiz</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .checkout-form {
            background: var(--white);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Primebiz</a>
        <nav>
            <a href="index.html" data-i18n="nav.home">Home</a>
            <a href="products.html" data-i18n="nav.products">Products</a>
            <a href="cart.html" data-i18n="nav.cart">Cart</a>
            <select class="lang-switcher" id="langSwitcher">
                <option value="en">English</option>
                <option value="ta">தமிழ்</option>
            </select>
        </nav>
    </header>

    <div class="container">
        <h1 style="text-align: center;">Checkout</h1>
        <form class="checkout-form" id="checkoutForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" required>
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="address" required placeholder="Street, Area, City, Pincode">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <select id="paymentMethod">
                    <option value="COD">Cash on Delivery</option>
                    <option value="CARD">Credit/Debit Card</option>
                    <option value="UPI">UPI</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.2rem;">Place Order</button>
        </form>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langSwitcher = document.getElementById('langSwitcher');
            if (langSwitcher) {
                langSwitcher.value = getLanguage();
                updateLanguage(langSwitcher.value);
                langSwitcher.addEventListener('change', (e) => updateLanguage(e.target.value));
            }

            document.getElementById('checkoutForm').onsubmit = async (e) => {
                e.preventDefault();
                const cart = JSON.parse(localStorage.getItem('primebiz_cart') || '[]');
                if (cart.length === 0) {
                    alert('Cart is empty!');
                    return;
                }

                const orderData = {
                    userId: 1, // Mocked current user
                    items: cart,
                    shippingAddress: document.getElementById('address').value,
                    paymentMethod: document.getElementById('paymentMethod').value,
                    customerName: document.getElementById('fullName').value,
                    customerPhone: document.getElementById('phone').value
                };

                try {
                    await ApiClient.createOrder(orderData);
                    alert('Order placed successfully!');
                    localStorage.removeItem('primebiz_cart');
                    window.location.href = 'index.html';
                } catch (error) {
                    alert('Order placement failed. Please try again.');
                }
            };
        });
    </script>
</body>
</html>
