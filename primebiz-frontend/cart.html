<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Primebiz</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .cart-table th, .cart-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .cart-table th {
            background-color: var(--primary-color);
            color: var(--white);
        }
        .cart-summary {
            text-align: right;
            margin-top: 2rem;
            font-size: 1.5rem;
        }
        .remove-btn {
            color: red;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Primebiz</a>
        <nav>
            <a href="index.html" data-i18n="nav.home">Home</a>
            <a href="products.html" data-i18n="nav.products">Products</a>
            <a href="cart.html" data-i18n="nav.cart">Cart</a>
            <select class="lang-switcher" id="langSwitcher">
                <option value="en">English</option>
                <option value="ta">தமிழ்</option>
            </select>
        </nav>
    </header>

    <div class="container">
        <h1 data-i18n="nav.cart">Shopping Cart</h1>
        <table class="cart-table">
            <thead>
                <tr>
                    <th data-i18n="product.name">Product</th>
                    <th data-i18n="product.price">Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cartItems">
                <!-- Cart items via JS -->
            </tbody>
        </table>
        <div class="cart-summary">
            <span data-i18n="cart.total">Total</span>: <span id="totalPrice">₹0</span>
            <br><br>
            <a href="checkout.html" class="btn btn-primary" data-i18n="cart.checkout">Checkout</a>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const langSwitcher = document.getElementById('langSwitcher');
            if (langSwitcher) {
                langSwitcher.value = getLanguage();
                updateLanguage(langSwitcher.value);
                langSwitcher.addEventListener('change', (e) => updateLanguage(e.target.value));
            }

            await renderCart();
        });

        async function renderCart() {
            const cart = JSON.parse(localStorage.getItem('primebiz_cart') || '[]');
            const itemsContainer = document.getElementById('cartItems');
            let total = 0;

            if (cart.length === 0) {
                itemsContainer.innerHTML = `<tr><td colspan="3" style="text-align:center">Cart is empty</td></tr>`;
                document.getElementById('totalPrice').textContent = '₹0';
                return;
            }

            let html = '';
            for (const productId of cart) {
                try {
                    const p = await ApiClient.getProductById(productId);
                    html += `
                        <tr>
                            <td>${p.name}</td>
                            <td>₹${p.price}</td>
                            <td><span class="remove-btn" onclick="removeItem(${productId})">Remove</span></td>
                        </tr>
                    `;
                    total += p.price;
                } catch (e) {
                    console.error('Error fetching product', productId);
                }
            }
            itemsContainer.innerHTML = html;
            document.getElementById('totalPrice').textContent = `₹${total}`;
        }

        function removeItem(productId) {
            let cart = JSON.parse(localStorage.getItem('primebiz_cart') || '[]');
            const index = cart.indexOf(productId);
            if (index > -1) cart.splice(index, 1);
            localStorage.setItem('primebiz_cart', JSON.stringify(cart));
            renderCart();
        }
    </script>
</body>
</html>
