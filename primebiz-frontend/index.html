<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primebiz - Premium Ecommerce</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Primebiz</a>
        <nav>
            <a href="index.html" data-i18n="nav.home">Home</a>
            <a href="products.html" data-i18n="nav.products">Products</a>
            <a href="cart.html" data-i18n="nav.cart">Cart</a>
            <select class="lang-switcher" id="langSwitcher">
                <option value="en">English</option>
                <option value="ta">தமிழ்</option>
            </select>
        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <h1 data-i18n="hero.title">Quality Products, Delivered to Your Door</h1>
            <p data-i18n="hero.subtitle">Bringing the best of Madurai and beyond to your home.</p>
            <a href="products.html" class="btn btn-primary" data-i18n="hero.cta">Shop Now</a>
        </section>

        <h2 style="text-align: center; margin-bottom: 2rem;" data-i18n="featured.title">Featured Products</h2>
        <div class="product-grid" id="featuredProducts">
            <!-- Products will be loaded via JS -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Primebiz Madurai. All rights reserved.</p>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
