<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Primebiz</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .product-detail-container {
            display: flex;
            gap: 3rem;
            background: var(--white);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .product-image {
            flex: 1;
            text-align: center;
        }
        .product-image img {
            max-width: 100%;
            border-radius: 10px;
        }
        .product-info {
            flex: 1;
        }
        .product-info h1 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .product-info .price {
            font-size: 2rem;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Primebiz</a>
        <nav>
            <a href="index.html" data-i18n="nav.home">Home</a>
            <a href="products.html" data-i18n="nav.products">Products</a>
            <a href="cart.html" data-i18n="nav.cart">Cart</a>
            <select class="lang-switcher" id="langSwitcher">
                <option value="en">English</option>
                <option value="ta">தமிழ்</option>
            </select>
        </nav>
    </header>

    <div class="container">
        <div class="product-detail-container" id="productDetail">
            <div class="product-image">
                <img id="pImage" src="https://via.placeholder.com/400" alt="Product">
            </div>
            <div class="product-info">
                <h1 id="pName">Loading...</h1>
                <div class="price" id="pPrice">₹0</div>
                <p id="pDesc">Loading description...</p>
                <button class="btn btn-primary" id="addToCartBtn" data-i18n="product.addtocart">Add to Cart</button>
            </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Locale init
            const langSwitcher = document.getElementById('langSwitcher');
            if (langSwitcher) {
                langSwitcher.value = getLanguage();
                updateLanguage(langSwitcher.value);
                langSwitcher.addEventListener('change', (e) => updateLanguage(e.target.value));
            }

            // Product logic
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const product = await ApiClient.getProductById(productId);
                document.getElementById('pName').textContent = product.name;
                document.getElementById('pPrice').textContent = `₹${product.price}`;
                document.getElementById('pDesc').textContent = product.description;
                
                document.getElementById('addToCartBtn').onclick = () => {
                    addToCart(product.id);
                };
            } catch (error) {
                document.getElementById('productDetail').innerHTML = `<p style="color:red">Product not found.</p>`;
            }
        });

        function addToCart(productId) {
            let cart = JSON.parse(localStorage.getItem('primebiz_cart') || '[]');
            cart.push(productId);
            localStorage.setItem('primebiz_cart', JSON.stringify(cart));
            alert('Added to cart!');
        }
    </script>
</body>
</html>
