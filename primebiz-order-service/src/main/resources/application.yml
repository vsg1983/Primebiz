server:
  port: 8085

spring:
  application:
    name: primebiz-order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/primebiz_order
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    config:
      uri: http://localhost:8888

spring:
  cloud:
    stream:
      bindings:
        paymentCompleted-in-0:
          destination: payment-events
          group: order-service-group


eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
